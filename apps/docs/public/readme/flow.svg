<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 236" width="956" height="236" role="img" aria-labelledby="title desc">
  <title id="title">How Good Webhooks delivers an event</title>
  <desc id="desc">Your app calls publish(), which records the event and one delivery per endpoint in PostgreSQL. A worker signs, sends, retries, and records each delivery. The receiver calls parseWebhook() to verify it and get a typed event.</desc>
  <style>
    .box { fill: #fafafa; stroke: #e4e4e7; stroke-width: 2; }
    .accent { fill: #09090b; }
    .title { font: 600 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #09090b; }
    .code { font: 500 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #09090b; }
    .caption { font: 400 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #6b6b74; }
    .arrow { stroke: #a1a1aa; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .step { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #0f0f11; stroke: #27272a; }
      .accent { fill: #fafafa; }
      .title, .code { fill: #fafafa; }
      .caption { fill: #a1a1aa; }
      .arrow { stroke: #71717a; }
      .step { fill: #09090b; }
    }
  </style>

  <g transform="translate(0 0)">
    <rect class="box" x="1" y="1" width="210" height="234" rx="14" />
    <circle class="accent" cx="34" cy="36" r="15" /><text class="step" x="34" y="41.5" text-anchor="middle">1</text>
    <text class="title" x="24" y="98">Your app</text>
    <text class="code" x="24" y="136">publish()</text>
    <text class="caption" x="24" y="180">records the event</text>
    <text class="caption" x="24" y="206">in your transaction</text>
  </g>
  <path class="arrow" d="M218 118 H240 M232 110 L240 118 L232 126" />

  <g transform="translate(248 0)">
    <rect class="box" x="1" y="1" width="210" height="234" rx="14" />
    <circle class="accent" cx="34" cy="36" r="15" /><text class="step" x="34" y="41.5" text-anchor="middle">2</text>
    <text class="title" x="24" y="98">PostgreSQL</text>
    <text class="code" x="24" y="136">webhook tables</text>
    <text class="caption" x="24" y="180">one delivery</text>
    <text class="caption" x="24" y="206">per endpoint</text>
  </g>
  <path class="arrow" d="M466 118 H488 M480 110 L488 118 L480 126" />

  <g transform="translate(496 0)">
    <rect class="box" x="1" y="1" width="210" height="234" rx="14" />
    <circle class="accent" cx="34" cy="36" r="15" /><text class="step" x="34" y="41.5" text-anchor="middle">3</text>
    <text class="title" x="24" y="98">Worker</text>
    <text class="code" x="24" y="136">worker.run()</text>
    <text class="caption" x="24" y="180">signs, sends,</text>
    <text class="caption" x="24" y="206">retries, records</text>
  </g>
  <path class="arrow" d="M714 118 H736 M728 110 L736 118 L728 126" />

  <g transform="translate(744 0)">
    <rect class="box" x="1" y="1" width="210" height="234" rx="14" />
    <circle class="accent" cx="34" cy="36" r="15" /><text class="step" x="34" y="41.5" text-anchor="middle">4</text>
    <text class="title" x="24" y="98">Receiver</text>
    <text class="code" x="24" y="136">parseWebhook()</text>
    <text class="caption" x="24" y="180">verifies it, returns</text>
    <text class="caption" x="24" y="206">a typed event</text>
  </g>
</svg>
