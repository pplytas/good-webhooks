version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  # The pnpm workspace root covers the library and the docs app. The examples/* npm roots
  # are left out on purpose: they pin a published good-webhooks version and move only
  # after the integration is verified against that release.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # CI tests 1.7.7 as the lowest supported Better Auth version (ci.yml, "Lowest supported
      # version, from the lockfile"). Raise that floor by hand, not through Dependabot.
      - dependency-name: better-auth
      - dependency-name: auth
