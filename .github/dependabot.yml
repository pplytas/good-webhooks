version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  # The pnpm workspace root covers the library and the docs app. The examples/* npm roots
  # are left out on purpose: they pin a published good-webhooks version and move only
  # after the integration is verified against that release.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # CI tests 1.7.7 as the lowest supported Better Auth version (ci.yml, "Lowest supported
      # version, from the lockfile"). Raise that floor by hand, not through Dependabot.
      - dependency-name: better-auth
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: auth
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      # @types/node stays on the lowest supported Node.js major (engines.node ">=24", Node 24 is
      # Maintenance LTS until 2028-04-30) so tsc rejects APIs that newer lines added. Raise the
      # major by hand when engines.node moves; minor and patch updates still flow.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
