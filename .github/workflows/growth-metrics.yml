name: Growth metrics
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: growth-metrics
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Take the snapshot
        env:
          # Traffic needs push access. METRICS_GITHUB_TOKEN is a fine-grained token with Administration read.
          # github.token is the fallback and gets 403 on the traffic endpoints.
          GITHUB_TOKEN: ${{ secrets.METRICS_GITHUB_TOKEN || github.token }}
        run: node scripts/growth-snapshot.mjs > "$RUNNER_TEMP/snapshot.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: metrics
          path: metrics
          persist-credentials: false
      - name: Append and push
        working-directory: metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/snapshot.json" >> snapshots.jsonl
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshots.jsonl
          git commit -m "Add growth snapshot for $(date -u +%Y-%m-%d)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:metrics
