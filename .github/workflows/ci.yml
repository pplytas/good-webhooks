name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    env:
      TEST_DATABASE_URL: postgres://postgres:webhooks_dev_only@127.0.0.1:55439/webhooks
      DATABASE_URL: postgres://postgres:webhooks_dev_only@127.0.0.1:55439/webhooks_demo
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: webhooks_dev_only
          POSTGRES_DB: webhooks
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d webhooks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - name: Prepare a fresh demo database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE webhooks_demo'
          psql "$DATABASE_URL" --single-transaction -v ON_ERROR_STOP=1 -f migrations/001-initial.sql
          psql "$DATABASE_URL" --single-transaction -v ON_ERROR_STOP=1 -f examples/basic/receiver.sql
      - name: Run the delivery and replay demo
        run: npm run example
      - name: Build and install the package archive
        shell: bash
        run: |
          npm pack
          archive="$PWD/$(node -p 'require("./package.json").name + "-" + require("./package.json").version + ".tgz"')"
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "$archive"
          node --input-type=module -e 'import { createWebhooks } from "good-webhooks"; import { parseWebhook } from "good-webhooks/verify"; import { readFile } from "node:fs/promises"; if (typeof createWebhooks !== "function" || typeof parseWebhook !== "function") throw new Error("Missing ESM exports"); const sql = await readFile(new URL(import.meta.resolve("good-webhooks/migrations/001-initial.sql")), "utf8"); if (!sql.includes("CREATE SCHEMA")) throw new Error("Missing migration");'
          node -e 'const { createWebhooks } = require("good-webhooks"); const { parseWebhook } = require("good-webhooks/verify"); if (typeof createWebhooks !== "function" || typeof parseWebhook !== "function") throw new Error("Missing CommonJS exports");'
      - name: Save the package archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: good-webhooks-pg${{ matrix.postgres }}
          path: good-webhooks-*.tgz
          if-no-files-found: error
          retention-days: 7
