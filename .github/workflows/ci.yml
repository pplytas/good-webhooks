name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    env:
      TEST_DATABASE_URL: postgres://postgres:webhooks_dev_only@127.0.0.1:55439/webhooks
      DATABASE_URL: postgres://postgres:webhooks_dev_only@127.0.0.1:55439/webhooks_demo
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: webhooks_dev_only
          POSTGRES_DB: webhooks
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d webhooks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - name: Prepare a fresh demo database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE webhooks_demo'
          psql "$DATABASE_URL" --single-transaction -v ON_ERROR_STOP=1 -f migrations/001-initial.sql
          psql "$DATABASE_URL" --single-transaction -v ON_ERROR_STOP=1 -f examples/basic/receiver.sql
      - name: Run the delivery and replay demo
        run: npm run example
      - name: Verify standalone and Better Auth package consumers
        run: npm run test:package
      - name: Save the package archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: good-webhooks-pg${{ matrix.postgres }}
          path: good-webhooks-*.tgz
          if-no-files-found: error
          retention-days: 7

  adapters:
    name: Better Auth storage adapters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: webhooks_dev_only
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: webhooks_local_proof
        ports:
          - 55440:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pwebhooks_local_proof"
          --health-interval 5s --health-timeout 5s --health-retries 24
      mongodb:
        image: mongo:8
        ports:
          - 55441:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Local-Proof-Only-Pass123
          MSSQL_MEMORY_LIMIT_MB: 2048
        ports:
          - 55442:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Local-Proof-Only-Pass123 -C -Q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:adapters
