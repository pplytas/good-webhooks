name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: webhooks_dev_only
          POSTGRES_DB: webhooks
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d webhooks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run example
      - run: npm pack --dry-run
