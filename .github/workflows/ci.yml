name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly run so new Better Auth releases in the "latest" matrix entries are tested without a push.
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.label || format('PostgreSQL {0}', matrix.postgres) }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]
        node: [24]
        include:
          - postgres: 18
            node: 26
            label: PostgreSQL 18, Node.js 26
    env:
      TEST_DATABASE_URL: postgres://postgres:webhooks_dev_only@127.0.0.1:55439/webhooks
      DATABASE_URL: postgres://postgres:webhooks_dev_only@127.0.0.1:55439/webhooks_demo
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: webhooks_dev_only
          POSTGRES_DB: webhooks
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d webhooks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Node.js 25 and later no longer bundle Corepack.
      - if: matrix.node != 24
        run: npm install --global corepack@latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:package
      - run: pnpm test
      - name: Rehearse backlog, receiver timeout, and process recovery
        run: pnpm test:operations
      - name: Rehearse the schema upgrade against the previous published package
        run: pnpm test:compat
      - name: Rehearse killed connections, an exclusive lock, and failing receivers
        run: pnpm test:chaos
      - name: Run the benchmark profile as a smoke check
        run: pnpm benchmark
      - name: Prepare a fresh demo database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE webhooks_demo'
          psql "$DATABASE_URL" --single-transaction -v ON_ERROR_STOP=1 -f packages/good-webhooks/migrations/001-initial.sql
          psql "$DATABASE_URL" --single-transaction -v ON_ERROR_STOP=1 -f packages/good-webhooks/examples/basic/receiver.sql
      - name: Run the delivery and replay demo
        run: pnpm example

  adapters:
    name: Better Auth ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported version, from the lockfile.
          - label: 1.7.7
            range: ''
          # Newest release in each supported line, resolved on every run.
          - label: latest 1.7
            range: ~1.7.7
          - label: latest 1.8
            range: ~1.8.0-0
    env:
      TEST_DATABASE_URL: postgres://postgres:webhooks_dev_only@127.0.0.1:55439/webhooks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: webhooks_dev_only
          POSTGRES_DB: webhooks
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: webhooks_local_proof
        ports:
          - 55440:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pwebhooks_local_proof"
          --health-interval 5s --health-timeout 5s --health-retries 24
      mongodb:
        image: mongo:8
        ports:
          - 55441:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Local-Proof-Only-Pass123
          MSSQL_MEMORY_LIMIT_MB: 2048
        ports:
          - 55442:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Local-Proof-Only-Pass123 -C -Q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install the Better Auth version under test
        if: matrix.range != ''
        working-directory: packages/good-webhooks
        env:
          BETTER_AUTH_RANGE: ${{ matrix.range }}
        run: |
          version=$(node scripts/better-auth-version.mjs "$BETTER_AUTH_RANGE")
          pnpm add -D "better-auth@$version" "auth@$version"
          for name in better-auth auth; do
            installed=$(node -p "require('./node_modules/$name/package.json').version")
            echo "$name $installed"
            test "$installed" = "$version"
          done
      - run: pnpm check:package
      - name: Run the Better Auth integration tests
        run: pnpm --filter good-webhooks exec vitest run test/better-auth-
      - run: pnpm test:adapters
      - name: Lint the archive and verify the packed consumers
        run: pnpm test:package

  package:
    name: Package consumers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Lint the archive and verify the packed consumers
        run: pnpm test:package
      - name: Save the verified package archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: good-webhooks
          path: packages/good-webhooks/good-webhooks-*.tgz
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - run: pnpm --filter @good-webhooks/docs check
      - run: pnpm --filter @good-webhooks/docs build
      - run: pnpm --filter @good-webhooks/docs check:links
      - run: pnpm --filter @good-webhooks/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @good-webhooks/docs check:browser

  examples:
    name: Consumer integration (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [order-fulfillment, better-auth-billing]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    env:
      TEST_DATABASE_URL: postgres://postgres:showcase_dev_only@127.0.0.1:55439/showcase_tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: showcase_dev_only
          POSTGRES_DB: showcase_tests
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d showcase_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
