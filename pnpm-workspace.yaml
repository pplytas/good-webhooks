packages:
  - packages/*
  - apps/*

# Approve only the native tools exercised by the package and adapter checks.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  workerd: true
  fsevents: false
overrides:
  # Security patches for transitive dev and test dependencies (Better Auth adapter matrix,
  # docs). The published package does not depend on these.
  undici@>=7.0.0 <7.30.1: ^7.30.1
  fast-uri@<3.1.9: ^3.1.9
  sharp@<0.35.5: ^0.35.5
  # Legacy Drizzle Kit loader: patch its esbuild development-server advisory.
  esbuild@<0.25.0: ^0.28.2
